# Handeye Toolkit 多相机产品配置。
# adapter 可填写 realsense-d435、opencv-rgb 或 dabai。
# 尖括号中的值和 settings 必须按相机适配器及现场设备填写；板参数必须与实物或证书一致。
mode: eye-to-hand
policy: standard
camera:
  adapter: "<camera-adapter>"
  source_id: "<camera-source>"
  settings: {}
piper:
  model: piper
  firmware_profile: v188
  can_channel: "<can-channel>"
target:
  squares: [12, 9]
  square_size_mm: 15.0
  marker_size_mm: 11.25
  dictionary: DICT_5X5_1000
